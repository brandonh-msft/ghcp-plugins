name: Generate Claude Marketplace

on:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Claude plugins marketplace
        run: |
          mkdir -p .claude-plugins
          cp marketplace.json .claude-plugins/marketplace.json

      - name: Commit and push changes
        if: success()
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .claude-plugins/marketplace.json
          git commit -m "Update Claude plugins marketplace.json" -a || echo "No changes to commit"
          git push