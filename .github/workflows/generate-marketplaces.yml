name: Generate Marketplace Variants

on:
  push:
    branches:
      - main
    paths:
      - marketplace.json
      - scripts/copy-marketplace-to-claude.sh
      - scripts/generate-codex-marketplace.mjs
      - .github/workflows/generate-marketplaces.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Generate Claude marketplace
        run: npm run copy-claude-marketplace

      - name: Generate Codex marketplace
        run: npm run generate:codex

      - name: Commit and push changes
        run: |
          git add -f .claude-plugins/marketplace.json .agents/plugins/marketplace.json
          if git diff --cached --quiet -- .claude-plugins/marketplace.json .agents/plugins/marketplace.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Claude and Codex marketplace variants"
          git push
